<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publications — Modal Thought</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 1.05rem;
      line-height: 1.75;
      color: #1a1a1a;
      background: #fff;
      margin: 0;
      padding: 0;
    }

    /* ── Header ──────────────────────────────────────────────── */
    .page-header {
      max-width: 680px;
      margin: 5rem auto 0;
      padding: 0 1.5rem 2.5rem;
      border-bottom: 1px solid #ddd;
    }

    .site-label {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.82rem;
      color: #999;
      text-decoration: none;
      letter-spacing: 0.04em;
      display: block;
      margin-bottom: 0.6rem;
    }
    .site-label:hover { color: #555; }

    h1 {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 2.4rem;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin: 0;
      color: #111;
    }

    /* ── Filter bar ──────────────────────────────────────────── */
    .filter-bar {
      max-width: 680px;
      margin: 1.5rem auto 0;
      padding: 0 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .filter-label {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.78rem;
      color: #aaa;
      margin-right: 4px;
    }

    .tag-btn {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.74rem;
      padding: 2px 10px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: white;
      color: #6b7280;
      cursor: pointer;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      line-height: 1.7;
    }
    .tag-btn:hover { border-color: #9ca3af; color: #374151; }
    .tag-btn.active {
      background: #334155;
      border-color: #334155;
      color: white;
    }

    /* ── Publication list ────────────────────────────────────── */
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 2rem 1.5rem 6rem;
    }

    .year-group { margin-bottom: 2.75rem; }

    .year-heading {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #aaa;
      margin: 0 0 1rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid #eee;
    }

    .pub-item {
      padding: 1rem 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .pub-item:last-child { border-bottom: none; }

    .pub-title {
      font-size: 1rem;
      font-weight: normal;
      font-style: italic;
      color: #111;
      margin: 0 0 0.2rem;
      line-height: 1.4;
    }

    .pub-authors {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.88rem;
      color: #555;
      margin: 0 0 0.15rem;
    }

    .pub-venue {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.85rem;
      color: #888;
      margin: 0 0 0.6rem;
    }

    /* ── Tags ────────────────────────────────────────────────── */
    .pub-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 0.6rem;
    }

    .tag {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.7rem;
      padding: 1px 8px;
      border-radius: 999px;
      background: #f1f5f9;
      color: #64748b;
      border: 1px solid #e2e8f0;
    }

    /* ── Links ───────────────────────────────────────────────── */
    .pub-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pub-link {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.78rem;
      color: #1a3c6e;
      text-decoration: none;
      padding: 2px 10px;
      border: 1px solid #c7d7ee;
      border-radius: 4px;
      transition: background 0.12s, border-color 0.12s;
    }
    .pub-link:hover {
      background: #eef4ff;
      border-color: #93b4dc;
      color: #1a3c6e;
    }

    /* ── Empty state ─────────────────────────────────────────── */
    #empty-msg {
      display: none;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.92rem;
      color: #aaa;
      padding: 2rem 0;
    }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 720px) {
      h1 { font-size: 1.8rem; }
      .page-header { margin-top: 2.5rem; }
    }
  </style>
</head>
<body>

  <header class="page-header">
    <a class="site-label" href="index.html">← Modal Thought</a>
    <h1>Publications</h1>
  </header>

  <div class="filter-bar" id="filter-bar">
    <span class="filter-label">Filter:</span>
    <button class="tag-btn active" data-tag="all">All</button>
  </div>

  <main>
    <div id="pub-list"></div>
    <p id="empty-msg">No publications match this filter.</p>
  </main>

  <script>
    const LINK_LABELS = {
      journal:   'Journal',
      pdf:       'PDF',
      preprint:  'Preprint',
      data:      'Data',
      code:      'Code',
      osf:       'OSF',
      supmat:    'Supplement',
    };

    async function load() {
      const pubs = await fetch('site/publications.json').then(r => r.json());

      // Collect all tags and build filter buttons
      const allTags = [...new Set(pubs.flatMap(p => p.tags || []))].sort();
      const filterBar = document.getElementById('filter-bar');
      allTags.forEach(tag => {
        const btn = document.createElement('button');
        btn.className = 'tag-btn';
        btn.dataset.tag = tag;
        btn.textContent = tag;
        filterBar.appendChild(btn);
      });

      // Group by year descending
      const byYear = {};
      pubs.forEach(p => {
        if (!byYear[p.year]) byYear[p.year] = [];
        byYear[p.year].push(p);
      });
      const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

      const container = document.getElementById('pub-list');

      function renderPub(p) {
        const item = document.createElement('div');
        item.className = 'pub-item';
        item.dataset.tags = JSON.stringify(p.tags || []);

        // Title
        const title = document.createElement('p');
        title.className = 'pub-title';
        title.textContent = p.title;
        item.appendChild(title);

        // Authors
        if (p.authors?.length) {
          const authors = document.createElement('p');
          authors.className = 'pub-authors';
          authors.textContent = p.authors.join(', ');
          item.appendChild(authors);
        }

        // Venue
        const venueParts = [p.journal];
        if (p.volume) {
          let v = p.volume;
          if (p.issue) v += `(${p.issue})`;
          if (p.pages) v += `, ${p.pages}`;
          venueParts.push(v);
        }
        const venue = document.createElement('p');
        venue.className = 'pub-venue';
        venue.textContent = venueParts.filter(Boolean).join(', ');
        item.appendChild(venue);

        // Tags
        if (p.tags?.length) {
          const tagRow = document.createElement('div');
          tagRow.className = 'pub-tags';
          p.tags.forEach(t => {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagRow.appendChild(span);
          });
          item.appendChild(tagRow);
        }

        // Links
        const linksObj = p.links || {};
        const linkKeys = Object.keys(linksObj);
        const hasLinks = linkKeys.length > 0 || p.slug;
        if (hasLinks) {
          const linkRow = document.createElement('div');
          linkRow.className = 'pub-links';

          if (p.slug) {
            const a = document.createElement('a');
            a.className = 'pub-link';
            a.href = `materials/${p.slug}/`;
            a.textContent = 'Materials';
            linkRow.appendChild(a);
          }

          linkKeys.forEach(key => {
            const a = document.createElement('a');
            a.className = 'pub-link';
            a.href = linksObj[key];
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.textContent = LINK_LABELS[key] || key;
            linkRow.appendChild(a);
          });

          item.appendChild(linkRow);
        }

        return item;
      }

      years.forEach(year => {
        const group = document.createElement('div');
        group.className = 'year-group';
        group.dataset.year = year;

        const heading = document.createElement('h2');
        heading.className = 'year-heading';
        heading.textContent = year;
        group.appendChild(heading);

        byYear[year].forEach(p => group.appendChild(renderPub(p)));
        container.appendChild(group);
      });

      // Filter logic
      let activeTag = 'all';

      function applyFilter() {
        const items = container.querySelectorAll('.pub-item');
        let visible = 0;
        items.forEach(item => {
          const tags = JSON.parse(item.dataset.tags);
          const show = activeTag === 'all' || tags.includes(activeTag);
          item.style.display = show ? '' : 'none';
          if (show) visible++;
        });

        // Hide year groups with no visible items
        container.querySelectorAll('.year-group').forEach(group => {
          const anyVisible = Array.from(group.querySelectorAll('.pub-item'))
            .some(el => el.style.display !== 'none');
          group.style.display = anyVisible ? '' : 'none';
        });

        document.getElementById('empty-msg').style.display = visible === 0 ? 'block' : 'none';
      }

      filterBar.addEventListener('click', e => {
        const btn = e.target.closest('.tag-btn');
        if (!btn) return;
        filterBar.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTag = btn.dataset.tag;
        applyFilter();
      });
    }

    load().catch(err => {
      document.getElementById('pub-list').textContent = 'Error loading publications: ' + err.message;
    });
  </script>
</body>
</html>
